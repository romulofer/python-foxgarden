[package]
name = "foxgarden-python"
version.workspace = true
edition.workspace = true
description = "Python support for FoxGarden, as an extension"

[lib]
name = "foxgarden_python"
path = "src/lib.rs"

# Reaches the editor only through `fg-extension`, like `foxgarden-spring` and
# `foxgarden-kmp`; it must not depend on `fg-core` or `syntax`.
[dependencies]
fg-extension = { path = "../../../foxgarden/crates/extension" }
tree-sitter = "0.26.11"
tree-sitter-python = "0.25.0"

[dev-dependencies]
